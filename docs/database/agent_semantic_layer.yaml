state_machines:
  change_proposals:
    evidence: backend/app/services/change_proposal.py:549
    complete: false
    transitions:
    - from:
      - DRAFT
      - VALIDATED
      - FAILED
      to: VALIDATED
      guard: validate 且 candidate.feasible=true；生成 digest
    - from:
      - DRAFT
      - VALIDATED
      - FAILED
      to: DRAFT
      guard: validate 不可行；digest=null
    - from:
      - VALIDATED
      to: CONFIRMED
      guard: revision/digest 匹配、当前用户确认、未过期且指纹一致
    - from:
      - CONFIRMED
      to: APPLIED
      guard: 通过 Business Service 重验、锁定、执行成功
    - from:
      - VALIDATED
      - CONFIRMED
      to: EXPIRED
      guard: 超过有效期、跨业务日或上下文变化
    - from:
      - CONFIRMED
      to: FAILED
      guard: 执行失败
    note: 这不是完整转换矩阵；编辑会清除旧确认；APPLIED 不可直接撤销
  plan_drafts:
    evidence: backend/app/services/plan_draft.py:154
    complete: false
    transitions:
    - from:
      - DRAFT
      to: REVIEWED
      guard: review 无 blocking 并生成 digest
    - from:
      - REVIEWED
      to: PUBLISHED
      guard: 发布权限、版本、确认及幂等验证
    note: review 会更新记录，不能归类为只读
  risk_events:
    evidence: backend/app/services/risk_event.py:426
    complete: false
    transitions:
    - from:
      - OPEN
      to: RESOLVED
      guard: 检测条件消失或授权业务关闭
    - from:
      - RESOLVED
      to: OPEN
      guard: 确定性检测器再次识别同一 dedupe_key
  tasks:
    evidence: backend/app/services/task.py:320
    complete: false
    transitions: []
    note: 代码没有简单 TODO→IN_PROGRESS→COMPLETED 强制矩阵；授权状态更新还受实际日期及排期约束。设为 COMPLETED 写 completed_at，从完成改回其他状态清空它；路线切换可暂存并恢复状态。不能宣称任意转换均被允许。
