agent_rules:
  rules:
    RULE 1: 优先使用已经定义的业务实体，不要直接猜数据库表。
    RULE 2: 优先使用 semantic_aliases 将自然语言映射到字段；重名需结合实体消歧。
    RULE 3: JOIN 必须优先使用 join_paths，并由受控服务编译。
    RULE 4: 不存在已确认关系时，不得自行假设 JOIN；MEDIUM/LOW 推断不可用于自动 JOIN。
    RULE 5: 默认应用 soft_delete_rules；不存在软删除机制时不得虚构条件。
    RULE 6: 必须应用 tenant / organization / workspace 范围（存在时）及当前系统对象权限；不可移除范围约束。
    RULE 7: 不得读取、过滤、排序、聚合或输出 HIDDEN 字段，亦不得将其放入 RAG。
    RULE 8: 不得向用户暴露 INTERNAL ID，除非业务操作需要；内部审计字段不作为普通查询能力。
    RULE 9: 状态查询必须使用对应实体状态字典；未知值返回 UNKNOWN，不发明状态。
    RULE 10: Agent 不直接执行数据库写 SQL。
    RULE 11: 写操作必须调用 Business Tool，并复用 Business Service 权限和校验。
    RULE 12: 重要写操作必须 requires_confirmation = true；本语义层建议所有 WRITE TOOL 默认确认。
  direct_sql_allowed: false
  write_sql_allowed: false
  hidden_fields_never_load: true
  allow_arbitrary_join: false
  query_limit_default: 50
  query_limit_max: 200
  sensitive_fields: 禁止通用查询；仅经对象授权、最小 DTO 和字段脱敏后按业务需求返回摘录
  read_only_tool_exclusions:
  - review_project_plan_draft
  - validate_project_plan
  permissions_document_is_grant: false
  blocked_current_query_aliases:
    task.task_code: 当前错误映射 id，修复前禁用
    task.owner_name: 仅主负责人，不可回答全部负责人查询
    task.owner_id: 仅主负责人，不可回答全部负责人查询
  current_entity_field_maps_are_evidence_not_allowlist: true
