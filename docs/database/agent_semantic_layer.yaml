default_query_filters:
  tasks:
    current_execution: is_active_branch = true AND status IN ('TODO','IN_PROGRESS')
    all_history: 不附加执行中筛选；仍应用对象权限
    note: 不同工具当前行为不一致，不能把当前执行筛选当成软删除
  users:
    directory: status = 'ACTIVE'
    note: 停用不是删除；历史负责人可显示最小 DTO
  project_members:
    current_members: is_active = true
    note: 失效成员不授予权限，现有 query_entities 可返回失效关系
  agent_conversations:
    note: ARCHIVED 是归档，不等于删除
query_intents:
- intent: list_project_tasks
  question: 查看某项目所有任务
  tables:
  - projects
  - tasks
  join_path: Project -> Task
  filters:
  - project_code
  tool: search_tasks
  semantics: 全量必须遍历分页；历史与当前执行范围显式区分
- intent: list_tasks_by_owner
  question: 查看某负责人任务
  tables:
  - users
  - tasks
  - task_participants
  join_path: Task -> AllOwners
  filters:
  - owner identity
  tool: search_tasks
  semantics: 姓名先消歧；完整负责人为主负责人与 OWNER 参与关系并集；当前工具过滤需修复
- intent: get_project_progress
  question: 查看项目进度
  tables:
  - projects
  - tasks
  - progress_updates
  - issues
  join_path: Project -> Task -> Progress
  filters:
  - project_code
  - days
  tool: get_project_progress_overview
  semantics: 没有 projects.progress；不以 AVG(tasks.progress_percent) 代表项目进度；当前 completed 计数缺陷见风险
- intent: get_task_progress
  question: 查看任务汇报
  tables:
  - tasks
  - progress_updates
  join_path: Task -> Progress
  filters:
  - task identity
  tool: get_task_progress
  semantics: 任务当前百分比与每次 AI 分析百分比分列；按 created_at,id 排序
- intent: list_overdue_tasks
  question: 查询延期未完成任务
  tables:
  - tasks
  join_path: ScopedTask
  filters:
  - due_date < business_today
  - status
  - is_active_branch
  tool: query_tasks
  semantics: 已超期是日期事实，AI DELAYED 为分析标签，不混用；NULL due_date 为未知
- intent: count_tasks_by_status
  question: 按状态统计任务
  tables:
  - tasks
  join_path: ScopedTask
  filters:
  - project_code
  tool: query_entities
  semantics: 只聚合可见任务，按主键去重；未知百分比不按 0 处理
- intent: get_dependency_graph
  question: 查看前后置任务
  tables:
  - task_links
  - tasks
  join_path: TaskDependency -> Endpoints
  filters:
  - project_code
  tool: get_dependency_graph
  semantics: 两个任务别名；跨项目和环检测走 SchedulingService；闭包需要递归或服务图算法
- intent: get_issue_followup
  question: 查看问题建议与行动
  tables:
  - issues
  - advice_records
  - action_items
  join_path: Issue -> Advice -> Action
  filters:
  - issue_id
  tool: get_issue_advice
  semantics: 最新建议不替代历史版本；建议不是事实，证据逐资源鉴权
- intent: list_project_risks
  question: 查看项目风险
  tables:
  - projects
  - risk_events
  join_path: Project -> Risk
  filters:
  - project_code
  - status
  - event_type
  tool: list_risk_events
  semantics: 风险事实、预测、信息缺失区分
- intent: get_notifications
  question: 查看通知是否已读
  tables:
  - notification_events
  join_path: ScopedNotification
  filters:
  - recipient=current_actor
  tool: get_notification_status
  semantics: SENT 仅渠道接受；ACKNOWLEDGED 才是系统确认
- intent: get_plan_snapshot
  question: 查看历史计划
  tables:
  - plan_versions
  - projects
  join_path: Project -> PlanVersion
  filters:
  - project_id
  - version
  tool: get_plan_version
  semantics: 建议新增；不是直接读取完整 snapshot JSON
- intent: list_current_members
  question: 查看项目成员
  tables:
  - projects
  - project_members
  - users
  join_path: Project -> ActiveMembers
  filters:
  - project_code
  tool: query_entities
  semantics: 成员不等于项目负责人；默认 is_active=true
tools:
- tool_name: get_current_user
  description: Return the authenticated actor (id / user_id, name, username, role) and business timezone. Use this
    for “我 / 我的任务”; never invent identity via find_users. Both id and user_id are the same numeric user primary
    key.
  business_entity: User
  operation: READ
  current_registry_operation: READ
  availability: EXISTING_TOOL
  required_parameters: &id001 []
  optional_parameters: []
  parameter_schema:
    type: object
    properties: {}
    required: *id001
  return_fields: &id008
  - name
  - username
  - department
  return_fields_status: RECOMMENDED_DTO_NOT_EXACT_CURRENT_RESPONSE
  permission_requirement: 已认证 + 所有对象读取权限；先过滤再分页、聚合
  data_scope:
    users: 已认证；现有 QueryService 返回 ACTIVE 用户目录的白名单 DTO；非租户范围
  underlying_service: ManagementQueryService
  underlying_tables:
  - users
  underlying_tables_status: PRIMARY_AND_RELATED_TABLES_NOT_EXHAUSTIVE_TRANSITIVE_WRITES
  requires_confirmation: false
  agent_execution_allowed: true
  note: 运行时权限以业务入口为准；此文档不授予权限
  evidence: backend/app/agents/management_tools.py
- tool_name: list_projects
  description: List all projects visible to the current user.
  business_entity: Project
  operation: READ
  current_registry_operation: READ
  availability: EXISTING_TOOL
  required_parameters: &id002 []
  optional_parameters: []
  parameter_schema:
    type: object
    properties: {}
    required: *id002
  return_fields: &id003
  - project_code
  - project_name
  - status
  - risk_level
  - owner_display
  - start_date
  - target_date
  return_fields_status: RECOMMENDED_DTO_NOT_EXACT_CURRENT_RESPONSE
  permission_requirement: 已认证 + 所有对象读取权限；先过滤再分页、聚合
  data_scope:
    projects: can_view_project(db, actor, project)
    users: 已认证；现有 QueryService 返回 ACTIVE 用户目录的白名单 DTO；非租户范围
    project_owners: 父项目 can_view_project；用户 DTO 最小披露
  underlying_service: ManagementQueryService
  underlying_tables:
  - projects
  - users
  - project_owners
  underlying_tables_status: PRIMARY_AND_RELATED_TABLES_NOT_EXHAUSTIVE_TRANSITIVE_WRITES
  requires_confirmation: false
  agent_execution_allowed: true
  note: 运行时权限以业务入口为准；此文档不授予权限
  evidence: backend/app/agents/management_tools.py
- tool_name: get_project
  description: Get one project by id or project_code (e.g. PRJ-1001).
  business_entity: Project
  operation: READ
  current_registry_operation: READ
  availability: EXISTING_TOOL
  required_parameters: []
  optional_parameters:
  - project_id
  - project_code
  parameter_schema:
    type: object
    properties:
      project_id:
        type: integer
        description: Numeric project id
      project_code:
        type: string
        description: Project code such as PRJ-1001
  return_fields: *id003
  return_fields_status: RECOMMENDED_DTO_NOT_EXACT_CURRENT_RESPONSE
  permission_requirement: 已认证 + 所有对象读取权限；先过滤再分页、聚合
  data_scope:
    projects: can_view_project(db, actor, project)
    users: 已认证；现有 QueryService 返回 ACTIVE 用户目录的白名单 DTO；非租户范围
    project_owners: 父项目 can_view_project；用户 DTO 最小披露
  underlying_service: ManagementQueryService
  underlying_tables:
  - projects
  - users
  - project_owners
  underlying_tables_status: PRIMARY_AND_RELATED_TABLES_NOT_EXHAUSTIVE_TRANSITIVE_WRITES
  requires_confirmation: false
  agent_execution_allowed: true
  note: 运行时权限以业务入口为准；此文档不授予权限
  evidence: backend/app/agents/management_tools.py
- tool_name: search_tasks
  description: Search tasks across visible projects with backend-resolved date presets. Use date_preset=today|tomorrow|this_week|next_week|next_7_days
    (this_week = Mon–Sun; next_7_days = today through today+6 inclusive). owner_scope=me means tasks owned by the
    current user (not merely visible). Do not use list_delayed_tasks to answer “今天/本周有什么任务”. For ad-hoc filters/aggregates
    prefer query_tasks.
  business_entity: Task
  operation: READ
  current_registry_operation: READ
  availability: EXISTING_TOOL
  required_parameters: []
  optional_parameters:
  - project_id
  - project_code
  - owner_scope
  - owner_id
  - date_preset
  - due_from
  - due_to
  - status
  - keyword
  - include_inactive
  - limit
  - cursor
  - owner_name
  - statuses
  - progress_min
  - progress_max
  - overdue
  parameter_schema:
