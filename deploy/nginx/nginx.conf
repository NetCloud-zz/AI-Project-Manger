user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # When the query string carries auth material, replace the whole args blob
    # so tickets / tokens / OAuth codes never land in access logs.
    map $args $logged_args {
        default $args;
        "~*(?:^|&)(?:ticket|sign|token|access_token|refresh_token|password|passwd|authorization|code|state)=" "[redacted]";
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri$is_args$logged_args" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
