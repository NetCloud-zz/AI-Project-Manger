upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — avoid stale upstream IPs after container recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Nginx's own liveness endpoint, never proxied.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend paths are passed through unchanged so that a browser, the dev
    # server and this proxy all address the API with identical URLs.
    # Buffering off so agent SSE streams are not delayed by nginx.
    location ^~ /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
    }

    # Exact matches only: the frontend owns /healthz, which a prefix match on
    # /health would otherwise swallow.
    location = /health {
        access_log off;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
    }

    location = /health/ready {
        access_log off;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
    }

    location = /docs {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
    }

    location = /redoc {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
    }

    location = /openapi.json {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
    }

    location / {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
    }
}
